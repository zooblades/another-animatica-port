name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: |
          set +e
          ./gradlew build --stacktrace --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            python3 - <<'PY'
          import re
          lines = open('build.log', errors='replace').read().splitlines()
          out = []
          for i, l in enumerate(lines):
              if re.search(r'error:|What went wrong|Execution failed|Could not|Caused by|FAILED', l):
                  out.extend(lines[i:i+4])
                  out.append('---')
          text = '\n'.join(out)[:20000] or '\n'.join(lines[-60:])
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Gradle build failed::' + text)
          PY
          fi
          exit $code
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
