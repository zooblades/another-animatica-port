modLoader = "javafml"
loaderVersion = "[1,)"
license = "LGPL-3.0-only"
issueTrackerURL = "https://github.com/zooblades/another-animatica-port/issues"

[[mods]]
modId = "animatica"
version = "${mod_version}"
displayName = "Animatica"
displayURL = "https://github.com/FoundationGames/Animatica"
logoFile = "assets/animatica/icon.png"
authors = "nazarbatrider"
credits = "FoundationGames - author of the original Animatica mod"
description = '''
Allow for animating more game textures using the MCPatcher/OptiFine animation format.
NeoForge port of the original Fabric mod by FoundationGames.
'''

[[mixins]]
config = "animatica.mixins.json"

[[dependencies.animatica]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.animatica]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,)"
ordering = "NONE"
side = "CLIENT"
